<!--
  Manual smoke test for js/cp-solver.js -- not linked from index.html or
  used by the app. Serve the repo (see README's "Running it" section) and
  open this file directly, e.g. http://localhost:8000/cp-test.html, to
  compare the backtracking solver against the CP (constraint propagation)
  solver on the classic 30-clue example puzzle. Both are synchronous, pure
  JS -- no WASM to wait on, unlike milp-test.html.
-->
<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>CP solver smoke test</title></head>
<body>
<pre id="out">running...</pre>
<script type="module">
  import { solveGrid, gridsEqual, cloneGrid } from './js/sudoku-engine.js';
  import { solveGridCP } from './js/cp-solver.js';

  const knownSolution = [
    [5,3,4, 6,7,8, 9,1,2],
    [6,7,2, 1,9,5, 3,4,8],
    [1,9,8, 3,4,2, 5,6,7],

    [8,5,9, 7,6,1, 4,2,3],
    [4,2,6, 8,5,3, 7,9,1],
    [7,1,3, 9,2,4, 8,5,6],

    [9,6,1, 5,3,7, 2,8,4],
    [2,8,7, 4,1,9, 6,3,5],
    [3,4,5, 2,8,6, 1,7,9],
  ];

  // The classic 30-clue Wikipedia example puzzle.
  const puzzle30 = [
    [5,3,0, 0,7,0, 0,0,0],
    [6,0,0, 1,9,5, 0,0,0],
    [0,9,8, 0,0,0, 0,6,0],
    [8,0,0, 0,6,0, 0,0,3],
    [4,0,0, 8,0,3, 0,0,1],
    [7,0,0, 0,2,0, 0,0,6],
    [0,6,0, 0,0,0, 2,8,0],
    [0,0,0, 4,1,9, 0,0,5],
    [0,0,0, 0,8,0, 0,7,9],
  ];

  const lines = [];
  function log(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); console.log(s); }

  log('Reference (backtracking) matches known solution: ' + gridsEqual(solveGrid(cloneGrid(puzzle30)), knownSolution));

  log('--- CP (constraint propagation): solving...');
  const t0 = performance.now();
  const cpResult = solveGridCP(cloneGrid(puzzle30));
  const t1 = performance.now();
  log('CP result: ' + (cpResult ? 'feasible' : 'INFEASIBLE/NULL'));
  if (cpResult) log('CP matches known solution: ' + gridsEqual(cpResult, knownSolution) + '  (' + (t1 - t0).toFixed(2) + ' ms)');

  log('DONE');
</script>
</body>
</html>
