<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>MILP solver smoke test</title></head>
<body>
<pre id="out">running...</pre>
<script type="module">
  import { solveGrid, gridsEqual, cloneGrid } from './js/sudoku-engine.js';
  import { solveGridMILPBinary, solveGridMILPInteger } from './js/milp-solver.js';

  const knownSolution = [
    [5,3,4, 6,7,8, 9,1,2],
    [6,7,2, 1,9,5, 3,4,8],
    [1,9,8, 3,4,2, 5,6,7],

    [8,5,9, 7,6,1, 4,2,3],
    [4,2,6, 8,5,3, 7,9,1],
    [7,1,3, 9,2,4, 8,5,6],

    [9,6,1, 5,3,7, 2,8,4],
    [2,8,7, 4,1,9, 6,3,5],
    [3,4,5, 2,8,6, 1,7,9],
  ];

  // Full 30-clue puzzle (the classic Wikipedia example) for the binary
  // formulation, which is expected to be fast.
  const puzzle30 = [
    [5,3,0, 0,7,0, 0,0,0],
    [6,0,0, 1,9,5, 0,0,0],
    [0,9,8, 0,0,0, 0,6,0],
    [8,0,0, 0,6,0, 0,0,3],
    [4,0,0, 8,0,3, 0,0,1],
    [7,0,0, 0,2,0, 0,0,6],
    [0,6,0, 0,0,0, 2,8,0],
    [0,0,0, 4,1,9, 0,0,5],
    [0,0,0, 0,8,0, 0,7,9],
  ];

  // Near-complete grid (only 6 empty cells) for the integer formulation --
  // a full 30-clue puzzle turned out to be impractically slow for this
  // pure-JS big-M solver (see chat notes), so this is a *functional*
  // smoke test of the code path, not a performance test.
  const puzzleNearFull = cloneGrid(knownSolution);
  const emptied = [[0,0],[1,4],[3,3],[5,7],[6,2],[8,8]];
  for (const [r,c] of emptied) puzzleNearFull[r][c] = 0;

  const lines = [];
  function log(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); console.log(s); }

  log('Reference (backtracking) matches known solution: ' + gridsEqual(solveGrid(cloneGrid(puzzle30)), knownSolution));

  log('--- Binary MILP (30-clue puzzle): solving...');
  const t0 = performance.now();
  const binResult = solveGridMILPBinary(cloneGrid(puzzle30));
  const t1 = performance.now();
  log('Binary MILP result: ' + (binResult ? 'feasible' : 'INFEASIBLE/NULL'));
  if (binResult) log('Binary MILP matches known solution: ' + gridsEqual(binResult, knownSolution) + '  (' + Math.round(t1 - t0) + ' ms)');

  log('--- Integer MILP (near-full grid, 6 empty cells): solving...');
  const t2 = performance.now();
  const intResult = solveGridMILPInteger(cloneGrid(puzzleNearFull), { timeoutMs: 15000 });
  const t3 = performance.now();
  log('Integer MILP result: ' + (intResult ? 'feasible' : 'INFEASIBLE/NULL'));
  if (intResult) log('Integer MILP matches known solution: ' + gridsEqual(intResult, knownSolution) + '  (' + Math.round(t3 - t2) + ' ms)');

  log('DONE');
</script>
</body>
</html>
